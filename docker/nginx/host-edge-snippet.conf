# Add this file to your HOST edge nginx (e.g. 7-wings-monorepo) conf.d directory,
# then reload that nginx container.
#
# SmurfElite stack must be running with:
#   SMURFELITE_NGINX_BIND=127.0.0.1:8001  (default in docker-compose.yml)
#
# From inside the edge nginx container, 172.17.0.1 is usually the Docker host.
# If proxy_pass fails, try host.docker.internal (add extra_hosts to edge compose).

upstream smurfelite_nginx {
    server 172.17.0.1:8001;
}

server {
    listen 80;
    server_name www.smurfelite.store api.smurfelite.store admin.smurfelite.store seller.smurfelite.store;

    location / {
        proxy_pass http://smurfelite_nginx;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After TLS is configured on the edge proxy, duplicate this block with:
#   listen 443 ssl;
#   ssl_certificate ...;
#   ssl_certificate_key ...;
