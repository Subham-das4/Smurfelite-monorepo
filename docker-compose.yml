# Variable substitution: copy docker/.env.example to docker/.env, then run:
#   docker compose --env-file docker/.env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smurfelite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smurfelite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smurfelite} -d ${POSTGRES_DB:-smurfelite}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  express-server:
    build:
      context: .
      dockerfile: apps/express-server/Dockerfile
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smurfelite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smurfelite}
      NODE_ENV: production
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  cron-server:
    build:
      context: .
      dockerfile: apps/cron-server/Dockerfile
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smurfelite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smurfelite}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      express-server:
        condition: service_started
    networks:
      - backend

  nextjs-app:
    build:
      context: .
      dockerfile: apps/nextjs-app/Dockerfile
      args:
        NEXT_PUBLIC_EXPRESS_SERVER_API: ${NEXT_PUBLIC_EXPRESS_SERVER_API:-http://api.smurfelite.store/api}
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
    networks:
      - frontend

  admin-app:
    build:
      context: .
      dockerfile: apps/admin-app/Dockerfile
      args:
        VITE_EXPRESS_SERVER_API: ${VITE_EXPRESS_SERVER_API:-http://api.smurfelite.store/api}
        VITE_APP_NAME: ${VITE_APP_NAME_ADMIN:-Admin Panel}
        VITE_PERSIST_SECRET: ${VITE_PERSIST_SECRET:-change-me}
    restart: unless-stopped
    networks:
      - frontend

  seller-app:
    build:
      context: .
      dockerfile: apps/seller-app/Dockerfile
      args:
        VITE_EXPRESS_SERVER_API: ${VITE_EXPRESS_SERVER_API:-http://api.smurfelite.store/api}
        VITE_APP_NAME: ${VITE_APP_NAME_SELLER:-Seller Portal}
        VITE_PERSIST_SECRET: ${VITE_PERSIST_SECRET:-change-me}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - express-server
      - nextjs-app
      - admin-app
      - seller-app
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
